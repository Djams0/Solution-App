<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="../static/css/chat.css">
    <title>Inscription</title>
</head>
<body>
  <div class="chat-wrapper">
    
    <!-- Barre du haut -->
    <header class="chat-header">
      <a href="{{ url_for('main.index') }}" class="btn-retour">retour</a>
      <h2>Discussion</h2>
      <a href="{{ url_for('main.recherche') }}">Mes Réseaux</a>
    </header>

    <!-- Zone des messages -->
    <div class="chat-container" id="chat-scroll">
      {% for msg in messages %}
        <div class="message {% if msg.expediteur_id == session['user_id'] %}sent{% else %}received{% endif %}">
          <div class="bubble">
            <div class="content">{{ msg.contenu }}</div>
            <div class="timestamp">{{ msg.timestamp }}</div>
          </div>
        </div>
      {% endfor %}
    </div>

    <!-- Formulaire en bas -->
    <form method="post" class="message-form">
      <input type="text" name="message" placeholder="Votre message..." required>
      <button type="submit">Envoyer</button>
    </form>

  </div>
</body>
