<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Recherche Utilisateur</title>
    <link rel="stylesheet" href="../static/css/recherche.css">
</head>
<body>
    <h1>Recherche d'un utilisateur</h1>
    <a href="{{ url_for('main.index') }}" class="btn-retour">retour</a>
    <form method="POST">
        <input type="text" name="username" placeholder="Entrez le nom d'utilisateur" required>
        <button type="submit">Rechercher</button>
    </form>

    {% if users %}
        <h2>Résultats de la recherche</h2>
        <ul>
            {% for user in users %}
                <li>
                    <span class="username">{{ user.username }}</span>
                    <!-- Bouton pour envoyer une demande d'amitié -->
                    <form action="{{ url_for('main.send_request', user_id_to=user.id) }}" method="POST" style="display:inline;">
                        <button type="submit">Envoyer une demande</button>
                    </form>                    
                </li>
            {% endfor %}
        </ul>
    {% elif request.method == 'POST' %}
        <p>Aucun utilisateur trouvé avec ce nom.</p>
    {% endif %}
</body>
</html>
